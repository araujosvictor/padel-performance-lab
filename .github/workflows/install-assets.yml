name: Install local pose tracking assets
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/install-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download pinned MediaPipe package from npm
        run: |
          set -euo pipefail
          mkdir -p vendor/mediapipe/wasm /tmp/mp-package
          npm pack @mediapipe/tasks-vision@1.2.0 --pack-destination /tmp/mp-package
          tar -xzf /tmp/mp-package/*.tgz -C /tmp/mp-package
          cp /tmp/mp-package/package/vision_bundle.mjs vendor/mediapipe/vision_bundle.mjs
          cp /tmp/mp-package/package/wasm/* vendor/mediapipe/wasm/
      - name: Download pinned pose model
        run: |
          curl --fail --location --retry 3 --output vendor/mediapipe/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          test -s vendor/mediapipe/pose_landmarker_lite.task
      - name: Commit assets to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/mediapipe
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle MediaPipe assets locally for GitHub Pages'
            git push
          fi
